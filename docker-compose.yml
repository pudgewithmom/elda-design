services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elda
      POSTGRES_USER: elda
      POSTGRES_PASSWORD: elda
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elda -d elda']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
